<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ministranci – Punkty</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--primary);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    .menu-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.15); }

    /* ===== SIDEBAR ===== */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .sidebar-overlay.open { opacity: 1; visibility: visible; }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      max-width: 85vw;
      height: 100%;
      background: white;
      z-index: 210;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      background: var(--primary);
      color: white;
      padding: 20px 16px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .sidebar nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .sidebar a, .sidebar button.nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border: none;
      background: none;
      color: var(--text);
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      min-height: 48px;
    }
    .sidebar a:hover, .sidebar button.nav-item:hover,
    .sidebar a.active, .sidebar button.nav-item.active {
      background: #eff6ff;
      color: var(--primary);
    }
    .badge {
      background: var(--danger);
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: auto;
    }

    /* ===== MAIN ===== */
    main { padding: 16px; max-width: 800px; margin: 0 auto; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== FORMS ===== */
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 14px;
      background: #f8fafc;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }
    textarea { resize: vertical; min-height: 90px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 48px;
      min-width: 48px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-block { width: 100%; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ===== LISTS ===== */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .title { font-weight: 600; }
    .list-item .meta { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

    .points-badge {
      background: #dbeafe;
      color: var(--primary-dark);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* ===== RANKING ===== */
    .rank-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .rank-item:last-child { border-bottom: none; }
    .rank-pos {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .rank-pos.gold { background: #fef08a; color: #854d0e; }
    .rank-pos.silver { background: #e2e8f0; color: #475569; }
    .rank-pos.bronze { background: #fed7aa; color: #9a3412; }
    .rank-name { flex: 1; font-weight: 600; }
    .rank-points { font-weight: 700; color: var(--primary); }

    /* ===== NOTIFICATIONS ===== */
    .notif-item {
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #f8fafc;
      border-left: 4px solid var(--border);
    }
    .notif-item.unread {
      background: #f0fdf4;
      border-left-color: var(--success);
    }
    .notif-item .from { font-weight: 600; font-size: 0.9rem; }
    .notif-item .time { font-size: 0.8rem; color: var(--muted); }
    .notif-item .body { margin-top: 6px; }

    /* ===== LOGIN ===== */
    .login-box {
      max-width: 400px;
      margin: 40px auto;
      padding: 28px 24px;
    }
    .login-box h2 { text-align: center; margin-bottom: 24px; }

    /* ===== EMPTY STATE ===== */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 500;
      z-index: 999;
      transition: transform 0.3s ease;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* ===== HIDDEN ===== */
    .hidden { display: none !important; }

    /* ===== DESKTOP ===== */
    @media (min-width: 768px) {
      .menu-btn { display: none; }
      .sidebar {
        position: fixed;
        transform: none;
        box-shadow: none;
        border-right: 1px solid var(--border);
      }
      .sidebar-overlay { display: none; }
      main {
        margin-left: 280px;
        padding: 24px;
      }
      header { padding-left: 300px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header id="app-header" class="hidden">
    <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
    <h1>Ministranci</h1>
    <div style="width:44px"></div>
  </header>

  <!-- SIDEBAR -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">Menu</div>
    <nav id="nav">
      <!-- wypełniane dynamicznie -->
    </nav>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <!-- LOGIN -->
    <div id="view-login" class="card login-box">
      <h2>Logowanie</h2>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="np. jan@example.com" autocomplete="email" />
      <label>Hasło</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      <button class="btn btn-primary btn-block" id="btn-login">Zaloguj</button>
      <p style="text-align:center;margin-top:16px;font-size:0.9rem;color:var(--muted)">
        Nie masz konta? Poproś administratora.
      </p>
    </div>

    <!-- RANKING -->
    <div id="view-ranking" class="hidden">
      <div class="card">
        <h2>🏆 Ranking</h2>
        <div id="ranking-list"></div>
      </div>
    </div>

    <!-- MOJE KONTO -->
    <div id="view-account" class="hidden">
      <div class="card">
        <h2>👤 Moje konto</h2>
        <div id="account-info"></div>
      </div>
    </div>

    <!-- KOD (uczestnik) -->
    <div id="view-code" class="hidden">
      <div class="card">
        <h2>🔑 Wpisz kod</h2>
        <label>Kod (max 10 cyfr)</label>
        <input type="text" id="code-input" maxlength="10" inputmode="numeric" pattern="[0-9]*" placeholder="np. 123456" />
        <button class="btn btn-success btn-block" id="btn-redeem">Odbierz punkty</button>
      </div>
    </div>

    <!-- POWIADOMIENIA (uczestnik) -->
    <div id="view-notifications" class="hidden">
      <div class="card">
        <h2>🔔 Powiadomienia <span id="notif-badge" class="badge hidden">0</span></h2>
        <div id="notifications-list"></div>
      </div>
    </div>

    <!-- GENERACJA KODÓW (admin) -->
    <div id="view-codes" class="hidden">
      <div class="card">
        <h2>➕ Generuj kod</h2>
        <label>Kod (max 10 cyfr) – zostaw puste aby wylosować</label>
        <input type="text" id="new-code" maxlength="10" inputmode="numeric" pattern="[0-9]*" placeholder="np. 482913" />
        <label>Liczba punktów</label>
        <input type="number" id="new-points" min="1" max="999" value="10" />
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-create-code">Utwórz kod</button>
          <button class="btn btn-outline" id="btn-random-code">Losuj kod</button>
        </div>
      </div>
      <div class="card">
        <h2>📋 Aktywne kody</h2>
        <div id="codes-list"></div>
      </div>
    </div>

    <!-- WIADOMOŚĆ (admin) -->
    <div id="view-message" class="hidden">
      <div class="card">
        <h2>✉️ Wyślij wiadomość</h2>
        <label>Odbiorca</label>
        <select id="msg-to"></select>
        <label>Treść</label>
        <textarea id="msg-body" placeholder="Napisz wiadomość..."></textarea>
        <button class="btn btn-primary btn-block" id="btn-send-msg">Wyślij</button>
      </div>
      <div class="card">
        <h2>📨 Ostatnio wysłane</h2>
        <div id="sent-messages"></div>
      </div>
    </div>

    <!-- UŻYTKOWNICY (admin) -->
    <div id="view-users" class="hidden">
      <div class="card">
        <h2>👥 Użytkownicy</h2>
        <div id="users-list"></div>
      </div>
    </div>
  </main>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // ===================== FIREBASE CONFIG =====================
    const firebaseConfig = {
      apiKey: "AIzaSyB27DmgYuuOZE2u9y9hYnQxD_dbxPYKsuk",
      authDomain: "ministranci-nspj.firebaseapp.com",
      projectId: "ministranci-nspj",
      storageBucket: "ministranci-nspj.firebasestorage.app",
      messagingSenderId: "918307132010",
      appId: "1:918307132010:web:6a26c4753b44a3c9feb013"
    };
    // ===========================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ===== STATE =====
    let currentUser = null;
    let userData = null;
    let isAdmin = false;
    let unreadCount = 0;

    // ===== HELPERS =====
    function showToast(msg, type = "") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show " + type;
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function $(id) { return document.getElementById(id); }

    function hideAllViews() {
      ["login","ranking","account","code","notifications","codes","message","users"]
        .forEach(v => $("view-" + v).classList.add("hidden"));
    }

    function showView(name) {
      hideAllViews();
      $("view-" + name).classList.remove("hidden");
      document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
      const active = document.querySelector(`[data-view="${name}"]`);
      if (active) active.classList.add("active");
      closeSidebar();
    }

    function openSidebar() {
      $("sidebar").classList.add("open");
      $("sidebar-overlay").classList.add("open");
    }
    function closeSidebar() {
      $("sidebar").classList.remove("open");
      $("sidebar-overlay").classList.remove("open");
    }

    function randomCode(len = 6) {
      let s = "";
      for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 10);
      return s;
    }

    function formatDate(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    // ===== AUTH =====
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const doc = await db.collection("users").doc(user.uid).get();
        if (!doc.exists) {
          showToast("Brak konta w bazie. Skontaktuj się z adminem.", "error");
          await auth.signOut();
          return;
        }
        userData = doc.data();
        isAdmin = userData.role === "admin";
        $("app-header").classList.remove("hidden");
        buildNav();
        showView("ranking");
        loadRanking();
        if (!isAdmin) {
          listenNotifications();
        }
      } else {
        currentUser = null;
        userData = null;
        isAdmin = false;
        $("app-header").classList.add("hidden");
        closeSidebar();
        hideAllViews();
        $("view-login").classList.remove("hidden");
      }
    });

    $("btn-login").onclick = async () => {
      const email = $("login-email").value.trim();
      const pass = $("login-password").value;
      if (!email || !pass) return showToast("Wypełnij wszystkie pola", "error");
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (e) {
        showToast("Błąd logowania: " + e.message, "error");
      }
    };

    // ===== NAV =====
    function buildNav() {
      const nav = $("nav");
      let html = "";
      html += `<button class="nav-item" data-view="ranking">🏆 Ranking</button>`;
      html += `<button class="nav-item" data-view="account">👤 Moje konto</button>`;

      if (isAdmin) {
        html += `<button class="nav-item" data-view="codes">🔑 Generacja kodów</button>`;
        html += `<button class="nav-item" data-view="message">✉️ Wiadomość</button>`;
        html += `<button class="nav-item" data-view="users">👥 Użytkownicy</button>`;
      } else {
        html += `<button class="nav-item" data-view="code">🔑 Kod</button>`;
        html += `<button class="nav-item" data-view="notifications">🔔 Powiadomienia <span id="nav-badge" class="badge hidden">0</span></button>`;
      }

      html += `<button class="nav-item" id="btn-logout" style="margin-top:20px;color:var(--danger)">🚪 Wyloguj</button>`;
      nav.innerHTML = html;

      nav.querySelectorAll("[data-view]").forEach(btn => {
        btn.onclick = () => {
          const v = btn.dataset.view;
          showView(v);
          if (v === "ranking") loadRanking();
          if (v === "account") loadAccount();
          if (v === "codes") loadCodes();
          if (v === "message") { loadUsersForMsg(); loadSentMessages(); }
          if (v === "users") loadUsers();
          if (v === "notifications") { loadNotifications(); markNotificationsRead(); }
        };
      });

      $("btn-logout").onclick = () => auth.signOut();
    }

    // ===== RANKING =====
    async function loadRanking() {
      const snap = await db.collection("users")
        .where("role", "==", "participant")
        .orderBy("points", "desc")
        .get();
      const list = $("ranking-list");
      if (snap.empty) {
        list.innerHTML = `<div class="empty">Brak uczestników</div>`;
        return;
      }
      let html = "";
      let pos = 1;
      snap.forEach(doc => {
        const u = doc.data();
        let cls = "";
        if (pos === 1) cls = "gold";
        else if (pos === 2) cls = "silver";
        else if (pos === 3) cls = "bronze";
        html += `
          <div class="rank-item">
            <div class="rank-pos ${cls}">${pos}</div>
            <div class="rank-name">${u.name || u.email}</div>
            <div class="rank-points">${u.points || 0} pkt</div>
          </div>`;
        pos++;
      });
      list.innerHTML = html;
    }

    // ===== ACCOUNT =====
    function loadAccount() {
      $("account-info").innerHTML = `
        <p><strong>Imię / Nazwa:</strong> ${userData.name || "—"}</p>
        <p style="margin-top:8px"><strong>Email:</strong> ${currentUser.email}</p>
        <p style="margin-top:8px"><strong>Punkty:</strong> <span class="points-badge">${userData.points || 0}</span></p>
        <p style="margin-top:8px"><strong>Rola:</strong> ${isAdmin ? "Administrator" : "Uczestnik"}</p>
      `;
    }

    // ===== REDEEM CODE (participant) =====
    $("btn-redeem").onclick = async () => {
      const code = $("code-input").value.trim();
      if (!code || code.length > 10) return showToast("Podaj prawidłowy kod (max 10 cyfr)", "error");

      try {
        const codeRef = db.collection("codes").doc(code);
        const codeDoc = await codeRef.get();
        if (!codeDoc.exists) return showToast("Kod nie istnieje lub został już użyty", "error");

        const data = codeDoc.data();
        const points = data.points || 0;

        await db.runTransaction(async (tx) => {
          const userRef = db.collection("users").doc(currentUser.uid);
          const userSnap = await tx.get(userRef);
          const currentPoints = userSnap.data().points || 0;
          tx.update(userRef, { points: currentPoints + points });
          tx.delete(codeRef);
        });

        userData.points = (userData.points || 0) + points;
        $("code-input").value = "";
        showToast(`Otrzymałeś ${points} punktów!`, "success");
        loadRanking();
      } catch (e) {
        console.error(e);
        showToast("Błąd: " + e.message, "error");
      }
    };

    // ===== ADMIN: CODES =====
    $("btn-random-code").onclick = () => {
      $("new-code").value = randomCode(6);
    };

    $("btn-create-code").onclick = async () => {
      let code = $("new-code").value.trim();
      const points = parseInt($("new-points").value) || 0;
      if (points < 1) return showToast("Podaj liczbę punktów", "error");
      if (!code) code = randomCode(6);
      if (code.length > 10 || !/^\d+$/.test(code)) return showToast("Kod musi mieć max 10 cyfr", "error");

      try {
        const ref = db.collection("codes").doc(code);
        const exists = await ref.get();
        if (exists.exists) return showToast("Taki kod już istnieje", "error");

        await ref.set({
          points,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
        $("new-code").value = "";
        showToast("Kod utworzony: " + code, "success");
        loadCodes();
      } catch (e) {
        showToast("Błąd: " + e.message, "error");
      }
    };

    async function loadCodes() {
      const snap = await db.collection("codes").orderBy("createdAt", "desc").get();
      const list = $("codes-list");
      if (snap.empty) {
        list.innerHTML = `<div class="empty">Brak aktywnych kodów</div>`;
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const c = doc.data();
        html += `
          <div class="list-item">
            <div class="info">
              <div class="title">${doc.id}</div>
              <div class="meta">${formatDate(c.createdAt)}</div>
            </div>
            <span class="points-badge">${c.points} pkt</span>
            <button class="btn btn-danger" style="padding:8px 12px;min-height:40px" data-del="${doc.id}">Usuń</button>
          </div>`;
      });
      list.innerHTML = html;
      list.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm("Usunąć kod " + btn.dataset.del + "?")) return;
          await db.collection("codes").doc(btn.dataset.del).delete();
          showToast("Kod usunięty", "success");
          loadCodes();
        };
      });
    }

    // ===== ADMIN: MESSAGES =====
    async function loadUsersForMsg() {
      const snap = await db.collection("users").where("role", "==", "participant").get();
      const sel = $("msg-to");
      let html = `<option value="all">Wszyscy</option>`;
      snap.forEach(doc => {
        const u = doc.data();
        html += `<option value="${doc.id}">${u.name || u.email}</option>`;
      });
      sel.innerHTML = html;
    }

    $("btn-send-msg").onclick = async () => {
      const to = $("msg-to").value;
      const body = $("msg-body").value.trim();
      if (!body) return showToast("Napisz treść wiadomości", "error");

      try {
        await db.collection("notifications").add({
          to: to === "all" ? "all" : to,
          from: currentUser.uid,
          fromName: userData.name || "Admin",
          body,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          readBy: []
        });
        $("msg-body").value = "";
        showToast("Wiadomość wysłana", "success");
        loadSentMessages();
      } catch (e) {
        showToast("Błąd: " + e.message, "error");
      }
    };

    async function loadSentMessages() {
      const snap = await db.collection("notifications")
        .orderBy("createdAt", "desc")
        .limit(20)
        .get();
      const list = $("sent-messages");
      if (snap.empty) {
        list.innerHTML = `<div class="empty">Brak wiadomości</div>`;
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const n = doc.data();
        const toLabel = n.to === "all" ? "Wszyscy" : n.to;
        html += `
          <div class="list-item">
            <div class="info">
              <div class="title">Do: ${toLabel}</div>
              <div class="meta">${formatDate(n.createdAt)}</div>
              <div style="margin-top:4px">${n.body}</div>
            </div>
          </div>`;
      });
      list.innerHTML = html;
    }

    // ===== NOTIFICATIONS (participant) =====
    function listenNotifications() {
      db.collection("notifications")
        .where("to", "in", [currentUser.uid, "all"])
        .orderBy("createdAt", "desc")
        .onSnapshot(snap => {
          unreadCount = 0;
          snap.forEach(doc => {
            const n = doc.data();
            if (!(n.readBy || []).includes(currentUser.uid)) unreadCount++;
          });
          updateNotifBadge();
        });
    }

    function updateNotifBadge() {
      const badge = $("nav-badge");
      const headerBadge = $("notif-badge");
      if (unreadCount > 0) {
        if (badge) { badge.textContent = unreadCount; badge.classList.remove("hidden"); }
        if (headerBadge) { headerBadge.textContent = unreadCount; headerBadge.classList.remove("hidden"); }
      } else {
        if (badge) badge.classList.add("hidden");
        if (headerBadge) headerBadge.classList.add("hidden");
      }
    }

    async function loadNotifications() {
      const snap = await db.collection("notifications")
        .where("to", "in", [currentUser.uid, "all"])
        .orderBy("createdAt", "desc")
        .get();
      const list = $("notifications-list");
      if (snap.empty) {
        list.innerHTML = `<div class="empty">Brak powiadomień</div>`;
        return;
      }
      let html = "";
      snap.forEach(doc => {
        const n = doc.data();
        const unread = !(n.readBy || []).includes(currentUser.uid);
        html += `
          <div class="notif-item ${unread ? "unread" : ""}">
            <div class="from">${n.fromName || "Admin"}</div>
            <div class="time">${formatDate(n.createdAt)}</div>
            <div class="body">${n.body}</div>
          </div>`;
      });
      list.innerHTML = html;
    }

    async function markNotificationsRead() {
      const snap = await db.collection("notifications")
        .where("to", "in", [currentUser.uid, "all"])
        .get();
      const batch = db.batch();
      snap.forEach(doc => {
        const n = doc.data();
        if (!(n.readBy || []).includes(currentUser.uid)) {
          batch.update(doc.ref, {
            readBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
          });
        }
      });
      await batch.commit();
      unreadCount = 0;
      updateNotifBadge();
    }

    // ===== USERS (admin) =====
    async function loadUsers() {
      const snap = await db.collection("users").orderBy("name").get();
      const list = $("users-list");
      let html = "";
      snap.forEach(doc => {
        const u = doc.data();
        html += `
          <div class="list-item">
            <div class="info">
              <div class="title">${u.name || u.email}</div>
              <div class="meta">${u.email} · ${u.role}</div>
            </div>
            <span class="points-badge">${u.points || 0} pkt</span>
          </div>`;
      });
      list.innerHTML = html || `<div class="empty">Brak użytkowników</div>`;
    }

    // ===== SIDEBAR EVENTS =====
    $("menu-btn").onclick = openSidebar;
    $("sidebar-overlay").onclick = closeSidebar;

    // Enter key on login
    $("login-password").addEventListener("keydown", e => {
      if (e.key === "Enter") $("btn-login").click();
    });
  </script>
</body>
</html>
